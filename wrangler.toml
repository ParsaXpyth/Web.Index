name = "webindex"                 # keep the same name as your existing Worker
main = "src/worker.js"
compatibility_date = "2025-01-01"
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/", "/media/*"]
# One KV namespace stores content, sessions and uploaded media (no R2/D1 needed).
# Wrangler creates it on first deploy. If it asks for an id: `npx wrangler kv namespace create DATA` and add  id = "..."
[[kv_namespaces]]
binding = "DATA"
