function observe(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{rootMargin:"-60px"});
 document.querySelectorAll(".rv:not(.in)").forEach(el=>io.observe(el))}
function render(){
 const h=document.documentElement;h.lang=lang;h.dir=lang=="fa"?"rtl":"ltr";try{localStorage.setItem("wi-lang",lang)}catch(e){}
 document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
 document.querySelectorAll("[data-alt]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.alt)));
 document.querySelectorAll("[data-l]").forEach(b=>{const on=b.dataset.l==lang;b.setAttribute("aria-pressed",on);b.style.color=on?"var(--violet)":"var(--text2)";b.style.borderColor=on?"var(--border-hi)":""});
 $("#logo").innerHTML=logo(28);$("#logo2").innerHTML=logo(36);
 $("#hh").innerHTML=`${t("h.pre")}<span class="hl">${t("h.hl")}</span>${t("h.post")}`;
 $("#meta").innerHTML=t("a.meta").map(m=>`<span class="tag">${m}</span>`).join("");$("#four").textContent=t("a.four");
 $("#team-grid").innerHTML=members.map((m,i)=>`<article class="card rv"><svg class="avatar" viewBox="0 0 64 64" role="img" aria-label="${t("t.name")} ${num(i)}"><rect width="64" height="64" fill="#202735"/><circle cx="32" cy="32" r="22" fill="none" stroke="#B99AFF" stroke-opacity=".6"${i%2?' stroke-dasharray="3 5"':""}/><circle cx="32" cy="32" r="10" fill="#B99AFF" fill-opacity="${.25+i*.12}"/><circle cx="${32+22*Math.cos(i*1.6)}" cy="${32+22*Math.sin(i*1.6)}" r="3" fill="#70E9FF"/></svg>
 <h3 style="font-size:1.35rem">${t("t.name")} ${num(i)}</h3><p class="mono" style="margin:6px 0 12px">${t("t.role")}</p><p style="color:var(--text2);font-size:.95rem;margin-bottom:16px">${t("t.bio")}</p>
 <div class="tags" dir="ltr">${m.map(x=>`<span class="tag">${x}</span>`).join("")}</div><div class="social">${t("t.social").map(s=>`<a href="#">${s}</a>`).join("")}</div></article>`).join("");
 $("#proj-grid").innerHTML=projects.map((p,i)=>`<article class="card p-${p.s} rv${p.s=="lg"?" glass":""}"><div class="thumb">${art(p.a,t("p.title")+" "+num(i))}</div><div class="body"><p class="mono">${t("p.cat")[i]}</p>
 <h3 style="font-size:${p.s=="lg"?"2rem":"1.3rem"}">${t("p.title")} ${num(i)}</h3><p style="color:var(--text2);font-size:.95rem">${t("p.desc")}</p><div class="tags" dir="ltr">${p.tags.map(x=>`<span class="tag">${x}</span>`).join("")}</div>
 <div class="links"><a href="#">${t("p.demo")} <span class="flip" style="display:inline-block">↗</span></a><a href="#">${ic.gh} ${t("p.repo")}</a></div></div></article>`).join("");
 $("#lab-grid").innerHTML=t("l.items").map((x,i)=>`<article class="card rv">${art((i+1)%4,x)}<span class="ghost" aria-hidden="true" dir="ltr">${["{ }","Aa","</>"][i]}</span>
 <div class="glass cap"><p class="mono">${num(i)}</p><h3 style="font-size:1.2rem">${x}</h3><p style="color:var(--text2);font-size:.9rem">${t("l.d")}</p></div></article>`).join("");
 observe()}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
const bg=$("#burger"),mp=$("#mp");bg.onclick=()=>{const o=mp.classList.toggle("open");bg.setAttribute("aria-expanded",o);bg.textContent=o?"✕":"☰"};
mp.querySelectorAll("a").forEach(a=>a.onclick=()=>{mp.classList.remove("open");bg.textContent="☰"});
render();
</script>
</body>
</html>
