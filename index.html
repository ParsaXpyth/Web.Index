<style>
:root{--bg:#090B10;--bg2:#11151D;--surface:#171D27;--elev:#202735;--violet:#B99AFF;--cyan:#70E9FF;--glow:rgba(185,154,255,.18);--text:#F3F6FB;--text2:#A5ADBB;--muted:#737F90;--border:rgba(255,255,255,.10);--border-hi:rgba(185,154,255,.40);--r-s:8px;--r-m:14px;--r-l:20px;--r-xl:28px;--vhover:#cdb5ff;--maxw:1200px;--pad:40px;--head:"Space Grotesk",system-ui,sans-serif;--body:Inter,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media(max-width:1023px){:root{--pad:28px}}@media(max-width:767px){:root{--pad:18px}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:88px;overflow-x:hidden;overflow-x:clip;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.7 var(--body);overflow-x:hidden;overflow-x:clip;width:100%;max-width:100%;position:relative}

h1,h2,h3,p{margin:0}h1,h2,h3{font-family:var(--head);line-height:1.05;letter-spacing:-.02em;font-weight:700}
[lang=fa] body,[lang=fa] h1,[lang=fa] h2,[lang=fa] h3,[lang=fa] .mono,[lang=fa] button{font-family:Vazirmatn,sans-serif;letter-spacing:0;text-transform:none}
[lang=fa] h1,[lang=fa] h2,[lang=fa] h3{line-height:1.3}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:var(--r-s)}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad)}.sec{padding-block:clamp(64px,10vw,120px)}
.mono{font:400 .8rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h2{font-size:clamp(2.2rem,5.5vw,4.5rem);max-width:14ch;margin-top:16px}.lead{color:var(--text2);font-size:clamp(1rem,1.4vw,1.15rem);max-width:56ch}
.hl{color:var(--violet);background:linear-gradient(transparent 70%,var(--glow) 70%)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:var(--r-m);border:1px solid var(--border);font-weight:600;font-size:.95rem;background:transparent;color:var(--text);cursor:pointer;transition:border-color .25s,background .25s;font-family:inherit}

.nav{position:sticky;top:12px;z-index:50;margin-top:12px}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 16px;background:rgba(17,21,29,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--r-l)}
.nav-links{display:flex;gap:28px;font-size:.92rem;color:var(--text2)}.nav-links a:hover{color:var(--text)}.nav-r{display:flex;align-items:center;gap:10px}
.nav .btn{padding:8px 16px;font-size:.85rem}.burger,.mpanel{display:none}
.logo{display:inline-flex;align-items:center;gap:10px;font:700 1rem var(--head)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;padding-block:clamp(40px,8vw,96px)}
.hero h1{font-size:clamp(2.8rem,7.5vw,6.5rem);margin-block:20px 24px}.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;padding-top:24px;border-top:1px solid var(--border)}
.team{display:grid;gap:16px;grid-template-columns:repeat(4,1fr);margin-top:48px}

.p-lg{grid-column:span 4;grid-row:span 2}.p-md{grid-column:span 2}.p-sm{grid-column:2/6}
.proj .card{padding:0;display:flex;flex-direction:column}.body{padding:20px 24px 24px;display:flex;flex-direction:column;gap:10px}

.cap{position:absolute;inset-inline:16px;bottom:16px;padding:14px 16px}

.foot{border-top:1px solid var(--border);padding-block:64px 32px;background:var(--bg2)}
.foot-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:40px}.foot h2{font-size:clamp(2rem,5vw,4rem);max-width:16ch;margin-top:20px}

.foot-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--border);font:400 .8rem var(--mono);color:var(--muted)}
[dir=rtl] .flip{transform:scaleX(-1)}
.skip{position:absolute;top:-100px;inset-inline-start:16px;z-index:99;background:var(--surface);padding:8px 12px;border-radius:var(--r-s)}.skip:focus{top:16px}
.js .rv{opacity:0;transform:translateY(24px);transition:opacity .6s ease-out,transform .6s ease-out}.js .rv.in{opacity:1;transform:none}
@media(max-width:1023px){.hero,.two{grid-template-columns:1fr;gap:32px}.art-hero{max-width:400px}.team{grid-template-columns:repeat(2,1fr)}.p-lg{grid-column:span 6;grid-row:auto}.p-md{grid-column:span 3}.p-sm{grid-column:span 6}.lab{grid-template-columns:1fr}}
@media(max-width:767px){.nav-links,.hide-m{display:none}.burger{display:inline-flex}.mpanel.open{display:flex;flex-direction:column;gap:12px;margin-top:8px;padding:20px}.team{grid-template-columns:1fr}.p-md{grid-column:span 6}.foot-top>div:last-child{gap:32px!important}}

/* ===== themes: SVG art follows tokens ===== */
[stroke="#B99AFF"]{stroke:var(--violet)}[stroke="#70E9FF"]{stroke:var(--cyan)}[stroke="#F3F6FB"]{stroke:var(--text)}
[fill="#B99AFF"]{fill:var(--violet)}[fill="#70E9FF"]{fill:var(--cyan)}[fill="#171D27"]{fill:var(--surface)}[fill="#11151D"]{fill:var(--bg2)}[fill="#202735"]{fill:var(--elev)}[fill="#A5ADBB"]{fill:var(--text2)}
stop[stop-color="#B99AFF"]{stop-color:var(--violet)}stop[stop-color="#70E9FF"]{stop-color:var(--cyan)}
::selection{background:var(--violet);color:#0B0B0C}
:root[data-theme=midnight-lime]{--bg:#0B0B0C;--bg2:#141416;--surface:#141416;--elev:#1B1B1E;--violet:#C6F432;--cyan:#FFFFFF;--vhover:#B6E52B;--glow:rgba(198,244,50,.12);--text:#FFFFFF;--text2:#B7B7B7;--muted:#8E8E93;--border:rgba(255,255,255,.12);--border-hi:rgba(198,244,50,.55);--r-s:4px;--r-m:6px;--r-l:10px;--r-xl:14px}
/* lime identity: thin lines, white featured surface, pulsing dot */
[data-theme=midnight-lime] .sec .rv>.mono:first-child::before{content:"";display:inline-block;width:24px;height:1px;background:var(--violet);margin-inline-end:10px;vertical-align:middle}
[data-theme=midnight-lime] .hero .mono::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--violet);margin-inline-end:10px;animation:pulse 2s ease-in-out infinite}
[data-theme=midnight-lime] .btn-p:hover{box-shadow:0 0 24px var(--glow)}
[data-theme=midnight-lime] .proj .p-lg{--text:#0B0B0C;--text2:#555555;--muted:#555555;--border:rgba(11,11,12,.12);background:#fff;color:#0B0B0C}
[data-theme=midnight-lime] .p-lg .links,[data-theme=midnight-lime] .p-lg .links a:hover{color:#0B0B0C}
[data-theme=midnight-lime] .p-lg:hover{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet),0 0 40px var(--glow)}
@keyframes pulse{50%{opacity:.35}}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes pop{from{opacity:0;transform:scale(.94)}}
/* appearance panel */
.nav-in{position:relative}
.apanel{display:none;position:absolute;top:calc(100% + 10px);inset-inline-end:0;width:min(300px,100%);padding:16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:0 24px 60px -20px rgba(0,0,0,.7);z-index:60}
.apanel.open{display:block;animation:rise .25s both}
.opt{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:12px;border:1px solid var(--border);border-radius:var(--r-m);background:transparent;color:var(--text);cursor:pointer;font:inherit;font-weight:600;text-align:start;transition:border-color .25s,transform .25s,background .25s}
.opt:hover{transform:translateY(-2px);border-color:var(--border-hi)}.opt[aria-pressed=true]{border-color:var(--violet);background:var(--glow)}
.sw{display:flex;direction:ltr}.sw i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.3);margin-inline-end:-4px}
.chk{margin-inline-start:auto;color:var(--violet);opacity:0;transition:opacity .25s}.opt[aria-pressed=true] .chk{opacity:1}
/* nav indicator, buttons, cards */
.nav-links a{position:relative;padding-block:4px;transition:color .25s}.nav-links a::after{content:"";position:absolute;inset-inline:0;bottom:-2px;height:1px;background:var(--violet);transform:scaleX(0);transform-origin:left;transition:transform .3s}
[dir=rtl] .nav-links a::after{transform-origin:right}.nav-links a:hover::after,.nav-links a.act::after{transform:scaleX(1)}.nav-links a.act{color:var(--text)}
.flip{display:inline-block;transition:transform .25s}.btn:hover .flip{transform:translateX(4px)}[dir=rtl] .btn:hover .flip{transform:scaleX(-1) translateX(4px)}
.avatar,.art{transition:transform .6s}img.avatar,img.art,video.art{object-fit:cover}video.art{background:var(--bg2)}.card:hover .avatar{transform:scale(1.08)}.card:hover .art{transform:scale(1.05)}
.social a{display:inline-block;transition:transform .2s,color .2s}.social a:hover{transform:translateY(-2px)}
.nav-in{animation:rise .6s both}.art-hero{animation:pop .9s .15s both}
/* process + stack */
.steps{list-style:none;padding:0;margin:48px 0 0;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.step{position:relative;padding-top:24px;border-top:1px solid var(--border)}
.step::before{content:"";position:absolute;top:-4px;inset-inline-start:0;width:7px;height:7px;border-radius:50%;background:var(--violet);box-shadow:0 0 12px var(--glow)}
.stack{margin-top:40px}.stack .tag{font-size:.9rem;padding:8px 16px}
@media(max-width:1023px){.steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:767px){.steps{grid-template-columns:1fr;gap:0}.step{border-top:0;border-inline-start:1px solid var(--border);padding:0 0 32px;padding-inline-start:24px}.step::before{top:2px;inset-inline-start:-4px}
.nav-in{gap:8px;padding:8px 10px}.nav-r{gap:6px}.glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--elev)}}
@media(prefers-reduced-motion:no-preference){.tt *,.tt *::before,.tt *::after{transition:background-color .4s,color .4s,border-color .4s,fill .4s,stroke .4s,stop-color .4s,box-shadow .4s!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.js .rv{opacity:1;transform:none}}

/* ===== v3: welcome bar, case study, contact form, lab, side gutters ===== */
[hidden]{display:none!important}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.9}
.welcome{position:relative;z-index:70;display:flex;justify-content:center;align-items:center;gap:14px;padding:8px 16px;background:var(--glow);border-bottom:1px solid var(--border-hi);font-size:.9rem;text-align:center}
.welcome button{background:none;border:0;color:var(--text2);cursor:pointer;font:inherit;padding:4px 8px}.welcome button:hover{color:var(--violet)}
.more{appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
dialog.cs{width:min(760px,94vw);max-height:90vh;padding:0;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--border-hi);border-radius:var(--r-l);box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
dialog.cs::backdrop{background:rgba(0,0,0,.72)}#csb{padding:28px 24px 24px}
.cs-x{position:absolute;inset-block-start:10px;inset-inline-end:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer}
.cs-m img,.cs-m video{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:var(--r-m);margin-bottom:18px;background:var(--bg2)}.cs-m:empty{display:none}
.cs .h2{max-width:none;font-size:clamp(1.5rem,4vw,2rem);margin:6px 0 12px}.cs-b{margin-top:18px}.cs-l{margin-top:22px}
.cs blockquote{margin:20px 0;padding-inline-start:16px;border-inline-start:2px solid var(--violet);color:var(--text2)}
.cform{margin-top:40px;max-width:640px}.cform label{display:block;margin:14px 0 6px;color:var(--text2);font-size:.85rem}
.cform input,.cform textarea{width:100%;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-m);color:var(--text);font:inherit}
.cform input:focus,.cform textarea:focus{outline:2px solid var(--violet);outline-offset:2px}.cf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cform .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}.hp{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
.lab-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ui-lab{position:absolute;inset-inline:16px;top:16px;display:grid;gap:10px}
.sw-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-m);background:var(--bg2);color:var(--text);font:inherit;cursor:pointer;transition:border-color .25s}
.sw-row:hover{border-color:var(--border-hi)}.sw-row i{flex:none;position:relative;width:34px;height:18px;border-radius:99px;border:1px solid var(--border-hi)}
.sw-row i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:12px;height:12px;border-radius:50%;background:var(--text2);transition:inset-inline-start .25s,background .25s}
.sw-row[aria-checked=true] i::after{inset-inline-start:18px;background:var(--violet)}
body{background:#000}
@media(max-width:767px){.cf-row{grid-template-columns:1fr}}

/* ===== menu animations ===== */
.nav-links{position:relative}.nav-links a{z-index:1;animation:rise .5s both}
.nav-links a:nth-of-type(1){animation-delay:.15s}.nav-links a:nth-of-type(2){animation-delay:.22s}.nav-links a:nth-of-type(3){animation-delay:.29s}.nav-links a:nth-of-type(4){animation-delay:.36s}
.nav-pill{position:absolute;top:50%;height:calc(100% + 14px);transform:translateY(-50%);border-radius:99px;background:var(--glow);border:1px solid var(--border-hi);opacity:0;pointer-events:none;transition:left .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
.nav-in{transition:background .3s,box-shadow .3s,border-color .3s}.nav.sc .nav-in{background:rgba(5,6,9,.88);border-color:var(--border-hi);box-shadow:0 12px 40px -18px rgba(0,0,0,.9)}
.nav .btn{transition:transform .25s,border-color .25s,background .25s}.nav .btn:hover{transform:translateY(-2px)}
#admbtn:hover svg{animation:wiggle .5s}.burger{transition:transform .3s,border-color .25s}.burger[aria-expanded=true]{transform:rotate(90deg)}
.mpanel.open{animation:menuIn .3s cubic-bezier(.2,.8,.2,1) both;transform-origin:top}.mpanel.open>*{animation:rise .4s both}
.mpanel.open>*:nth-child(1){animation-delay:.04s}.mpanel.open>*:nth-child(2){animation-delay:.09s}.mpanel.open>*:nth-child(3){animation-delay:.14s}.mpanel.open>*:nth-child(4){animation-delay:.19s}.mpanel.open>*:nth-child(5){animation-delay:.24s}.mpanel.open>*:nth-child(6){animation-delay:.29s}
.mpanel a{transition:color .2s,transform .2s}.mpanel a:not(.btn):hover{color:var(--violet);transform:translateX(6px)}[dir=rtl] .mpanel a:not(.btn):hover{transform:translateX(-6px)}
@keyframes menuIn{from{opacity:0;transform:translateY(-10px) scaleY(.92)}}@keyframes wiggle{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
</style>

(()=>{
const D=document.documentElement,rm=matchMedia("(prefers-reduced-motion:reduce)"),big=matchMedia("all");
const hexRgb=h=>{h=(h||"#fff").trim().replace("#","");if(h.length==3)h=[...h].map(c=>c+c).join("");const n=parseInt(h,16);return isNaN(n)?[255,255,255]:[n>>16&255,n>>8&255,n&255]};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
let C1=[185,154,255],C2=[112,233,255],lime=false;
function colors(){const s=getComputedStyle(D);C1=hexRgb(s.getPropertyValue("--violet"));C2=hexRgb(s.getPropertyValue("--cyan"));lime=D.dataset.theme=="midnight-lime";typeof mk=="function"&&mk()}
let cv,cx,W=0,H=0,ps=[],spr={},last=0,raf=0,ly=0,boost=0,mx=-999,my=-999;
function mk(){const make=(c,a)=>{const n=64,o=document.createElement("canvas");o.width=o.height=n;const x=o.getContext("2d"),g=x.createRadialGradient(n/2,n/2,0,n/2,n/2,n/2),q=`${c[0]},${c[1]},${c[2]}`;
  g.addColorStop(0,`rgba(${q},${a})`);g.addColorStop(.25,`rgba(${q},${a*.55})`);g.addColorStop(1,`rgba(${q},0)`);x.fillStyle=g;x.fillRect(0,0,n,n);return o};
 spr={w:make([255,255,255],1),a:make(C1,1),b:make(C2,1)}}
/* floating particles on a black background (desktop only) */
function setup(){
 if(!big.matches){if(cv){cv.remove();cv=null}cancelAnimationFrame(raf);raf=0;return}
 if(!cv){cv=document.createElement("canvas");cv.id="fx";cv.setAttribute("aria-hidden","true");document.body.prepend(cv);cx=cv.getContext("2d")}
 const d=Math.min(devicePixelRatio||1,1.5),ow=W;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
 if(ow===W&&ps.length){colors();paint(performance.now());start();return}
 const n=Math.min(150,Math.max(45,Math.round(W*H/10500)));
 ps=Array.from({length:n},()=>{const z=Math.random();return{x:Math.random()*W,y:Math.random()*H,z,r:.6+z*2.2,vx:(Math.random()-.5)*(10+z*22),vy:(Math.random()-.5)*(10+z*22),ph:Math.random()*6.28,k:(q=>q<.55?"a":q<.8?"b":"w")(Math.random()),dx:0,dy:0}});
 colors();paint(performance.now());start()}
function paint(ts){
 cx.clearRect(0,0,W,H);const px=mx>0?(mx-W/2)/W:0,py=my>0?(my-H/2)/H:0;
 for(const p of ps){p.dx=p.x-px*p.z*40;p.dy=p.y-py*p.z*40}
 cx.lineWidth=1;
 for(let i=0;i<ps.length;i++){const a=ps[i];
  for(let j=i+1;j<ps.length;j++){const b=ps[j],dx=a.dx-b.dx,dy=a.dy-b.dy,d2=dx*dx+dy*dy;if(d2<10000){cx.strokeStyle=rgba(a.k=="w"?[255,255,255]:C1,(1-d2/10000)*.13);cx.beginPath();cx.moveTo(a.dx,a.dy);cx.lineTo(b.dx,b.dy);cx.stroke()}}
  if(mx>0){const dx=a.dx-mx,dy=a.dy-my,d2=dx*dx+dy*dy;if(d2<28000){cx.strokeStyle=rgba(C2,(1-d2/28000)*.35);cx.beginPath();cx.moveTo(a.dx,a.dy);cx.lineTo(mx,my);cx.stroke()}}}
 for(const p of ps){const tw=.55+.45*Math.sin(ts/900+p.ph),s=p.r*7*(W<768?1.3:1);cx.globalAlpha=Math.min(1,(.35+.6*p.z)*tw*(W<768?1.4:1));cx.drawImage(spr[p.k],p.dx-s/2,p.dy-s/2,s,s)}

function frame(ts){raf=0;if(!cv||document.hidden)return;if(ts-last<33){raf=requestAnimationFrame(frame);return}
 const dt=Math.min(.1,(ts-last)/1000);last=ts;boost=Math.max(0,boost-dt*2);const k=1+boost;
 for(const p of ps){p.x+=p.vx*dt*k;p.y+=p.vy*dt*k;if(p.x<-20)p.x=W+20;else if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;else if(p.y>H+20)p.y=-20}

function start(){if(cv&&!raf&&!rm.matches&&!document.hidden)raf=requestAnimationFrame(frame)}
addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;if(cv&&rm.matches)paint(performance.now())},{passive:true});
["pointerup","pointercancel"].forEach(n=>addEventListener(n,e=>{if(e.pointerType!="mouse")mx=my=-999}));

addEventListener("scroll",()=>{const y=scrollY;boost=Math.min(3,boost+Math.abs(y-ly)/90);ly=y},{passive:true});
const labs=[];let lio=null,lraf=0;
const fit=l=>{const r=l.cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);l.w=r.width;l.h=r.height;l.cv.width=r.width*d;l.cv.height=r.height*d;l.cx.setTransform(d,0,0,d,0,0)};
const field=(l,t)=>{const{cx,w,h}=l;cx.clearRect(0,0,w,h);cx.lineWidth=1.3;
 for(let y=14;y<h;y+=26)for(let x=14;x<w;x+=26){let a=(Math.sin(x*.012+t*.0006)+Math.cos(y*.014-t*.0005))*Math.PI;const dx=l.px-x,dy=l.py-y,d=Math.hypot(dx,dy),k=d<150?1-d/150:0;
  if(k)a=a*(1-k)+Math.atan2(dy,dx)*k;cx.strokeStyle=rgba(k?C2:C1,.3+.6*k);cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+Math.cos(a)*12,y+Math.sin(a)*12);cx.stroke()}};
const orbit=l=>{const{cx,w,h}=l,on=l.px>0,tx=on?l.px:w/2,ty=on?l.py:h/2;cx.clearRect(0,0,w,h);cx.lineWidth=1.6;
 for(const p of l.ps){p.a+=.014*p.s;const ox=p.x,oy=p.y;p.x+=(tx+Math.cos(p.a)*p.r-p.x)*.06;p.y+=(ty+Math.sin(p.a)*p.r*.6-p.y)*.06;
  cx.strokeStyle=rgba(p.c?C2:C1,.7);cx.beginPath();cx.moveTo(ox,oy);cx.lineTo(p.x,p.y);cx.stroke()}};
function lloop(ts){lraf=0;if(document.hidden)return;let any=0;for(const l of labs)if(l.on){any=1;l.draw(l,ts)}if(any&&!rm.matches)lraf=requestAnimationFrame(lloop)}

window.wiAfterRender=()=>{
 lio&&lio.disconnect();labs.length=0;const cards=[...document.querySelectorAll("#lab-grid article")];if(!cards.length)return;
 lio=new IntersectionObserver(es=>es.forEach(e=>{const l=labs.find(x=>x.card===e.target);if(l){l.on=e.isIntersecting;if(l.on)kick()}}));
 cards.forEach((card,i)=>{card.querySelector(":scope>svg")?.remove();
  if(i<2){const c=document.createElement("canvas");c.className="lab-cv";c.setAttribute("aria-hidden","true");card.prepend(c);
   const l={card,cv:c,cx:c.getContext("2d"),px:-999,py:-999,on:false,draw:i?orbit:field};fit(l);
   if(i)l.ps=Array.from({length:70},()=>({x:Math.random()*l.w,y:Math.random()*l.h,a:Math.random()*6.28,r:30+Math.random()*90,s:(Math.random()<.5?-1:1)*(.5+Math.random()),c:Math.random()<.35}));
   labs.push(l);card.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect();l.px=e.clientX-r.left;l.py=e.clientY-r.top;kick()});
   card.addEventListener("pointerleave",()=>{l.px=l.py=-999;kick()});lio.observe(card)}
  else{const u=document.createElement("div"),fa=lang=="fa";u.className="ui-lab";
   u.innerHTML=`<button type="button" class="sw-row" role="switch" data-sw="theme" aria-checked="${D.dataset.theme=="midnight-lime"}"><span>${t("lab.th")}</span><i></i></button><button type="button" class="sw-row" role="switch" data-sw="lang" aria-checked="${!fa}"><span>${fa?"English · LTR":"فارسی · RTL"}</span><i></i></button>`;
   u.querySelector("[data-sw=theme]").onclick=()=>setTheme(D.dataset.theme=="midnight-lime"?"cyber-violet":"midnight-lime",1);
   u.querySelector("[data-sw=lang]").onclick=()=>{lang=lang=="fa"?"en":"fa";render()};card.prepend(u)}});
 kick()};
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{setup();labs.forEach(fit);kick()},150)});

new MutationObserver(()=>{colors();if(cv&&rm.matches)paint(performance.now());document.querySelectorAll("[data-sw=theme]").forEach(b=>b.setAttribute("aria-checked",D.dataset.theme=="midnight-lime"));kick()}).observe(D,{attributes:true,attributeFilter:["data-theme"]});

})();
